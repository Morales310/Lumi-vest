  <meta name="color-scheme" content="dark light" />

  <meta name="robots" content="noindex" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <title>Sign in · LUMI-VEST</title>
  <meta name="description" content="Sign in or create your LUMI-VEST account to browse verified homes in Kaduna." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="auth.css?v=2" />
  <script src="auth-core.js?v=2"></script>
</head>
<body class="auth-body">

        </g>
      </svg>
    </div>
    <div class="art-veil"></div>
  </div>

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="authHeading">
      <header class="auth-top">
        <a class="brand" href="auth.html" aria-label="LUMI-VEST">
          <img class="logo" src="img/IMG-20260425-WA0004.jpg" alt="" width="50" height="48" />
          <span class="lumi">LUMI-VEST</span>
        </a>
        <button class="icon-btn theme-toggle" type="button" id="themeToggle" aria-label="Toggle light / dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 8.5 8.5 0 1 0 20 13.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" stroke-linecap="round"/></svg>
        </button>
      </header>

      <fieldset class="roles" id="roles">
        <legend>I am a…</legend>
        <label class="role"><input type="radio" name="role" value="customer" checked/><span class="role-card"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5" stroke-linecap="round"/></svg><b>Customer</b><small>Browse &amp; save homes</small></span></label>
        <label class="role"><input type="radio" name="role" value="agent" /><span class="role-card"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 13h18" stroke-linecap="round"/></svg><b>Agent</b><small>List &amp; manage homes</small></span></label>
        <label class="role"><input type="radio" name="role" value="company" /><span class="role-card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V6.5L12 3l8 3.5V20M2.5 20h19M8.5 9h2M13.5 9h2M8.5 13h2M13.5 13h2M10.5 20v-3.5h3V20" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Company</b><small>Real estate firm</small></span></label>
      </fieldset>

      <div class="seg" role="tablist" aria-label="Account" id="authTabs">
        <span class="seg-pill" aria-hidden="true"></span>
        <button class="seg-btn" role="tab" id="tabSignin" type="button" aria-selected="true" aria-controls="panelSignin" data-tab="signin">Sign in</button>
        <button class="seg-btn" role="tab" id="tabSignup" type="button" aria-selected="false" aria-controls="panelSignup" data-tab="signup" tabindex="-1">Sign up</button>
      </div>

      <!-- ===== SIGN IN ===== -->
      <div class="panel" id="panelSignin" role="tabpanel" aria-labelledby="tabSignin">
        <h1 id="authHeading" class="auth-title">Welcome back</h1>
        <p class="auth-sub" id="siSub">Sign in to browse verified homes across Kaduna.</p>

        <div class="alert" id="siAlert" role="alert" tabindex="-1" hidden></div>

        <form id="signinForm" novalidate>
          <div class="field">
            <label for="siId">Email or username</label>
            <div class="input-wrap"><input id="siId" name="siId" type="text" autocomplete="username" placeholder="you@example.com or username" required aria-describedby="siIdErr" autocapitalize="off" spellcheck="false"/></div>
            <p class="field-err" id="siIdErr" hidden></p>
          </div>
          <div class="field">
            <label for="siPassword">Password</label>
            <div class="input-wrap">
              <input id="siPassword" name="siPassword" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required aria-describedby="siPasswordErr" />
              <button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false" data-toggle="siPassword"><svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <p class="field-err" id="siPasswordErr" hidden></p>
          </div>
          <p class="caps-note" id="siCaps" hidden>Caps Lock is on</p>
          <div class="row-between">
            <label class="check"><input type="checkbox" id="siRemember" /><span>Keep me signed in</span></label>
          </div>
          <button class="btn btn-gradient auth-submit" type="submit" id="siSubmit"><span class="btn-label" id="siLabel">Sign in as customer</span><span class="spinner" aria-hidden="true"></span></button>
        </form>

        <div class="divider"><span>or</span></div>
        <div class="google-slot" data-google="signin"></div>
        <p class="switch-note">New to LUMI-VEST? <button class="link-btn" type="button" data-tab="signup">Create an account</button></p>
      </div>

      <!-- ===== SIGN UP ===== -->
      <div class="panel" id="panelSignup" role="tabpanel" aria-labelledby="tabSignup" hidden>
        <h2 class="auth-title" id="suHeading">Create your account</h2>
        <p class="auth-sub" id="suSub">It takes under a minute. No spam, ever.</p>

        <div class="alert" id="suAlert" role="alert" tabindex="-1" hidden></div>

        <form id="signupForm" novalidate>
          <div class="field-grid">
          <div class="field">
            <label for="suFirst">First name</label>
            <div class="input-wrap"><input id="suFirst" name="suFirst" type="text" autocomplete="given-name" placeholder="Jane" required aria-describedby="suFirstErr" /></div>
            <p class="field-err" id="suFirstErr" hidden></p>
          </div>
          <div class="field">
            <label for="suLast">Last name</label>
            <div class="input-wrap"><input id="suLast" name="suLast" type="text" autocomplete="family-name" placeholder="Doe" required aria-describedby="suLastErr" /></div>
            <p class="field-err" id="suLastErr" hidden></p>
          </div>
          </div>
          <div class="field">
            <label for="suUsername">Username</label>
            <div class="input-wrap"><input id="suUsername" name="suUsername" type="text" autocomplete="username" placeholder="jane_doe" required aria-describedby="suUsernameErr" autocapitalize="off" spellcheck="false" maxlength="20"/></div>
            <p class="field-err" id="suUsernameErr" hidden></p>
          </div>
          <div class="field">
            <label for="suEmail">Email</label>
            <div class="input-wrap"><input id="suEmail" name="suEmail" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="suEmailErr" autocapitalize="off" spellcheck="false" inputmode="email"/></div>
            <p class="field-err" id="suEmailErr" hidden></p>
          </div>
          <div class="field">
            <label for="suPhone">Phone number</label>
            <div class="input-wrap"><input id="suPhone" name="suPhone" type="tel" autocomplete="tel" placeholder="+234 801 234 5678" required aria-describedby="suPhoneErr" inputmode="tel"/></div>
            <p class="field-err" id="suPhoneErr" hidden></p>
          </div>
          <div class="field">
            <label for="suAddress">Location address</label>
            <div class="input-wrap"><input id="suAddress" name="suAddress" type="text" autocomplete="street-address" placeholder="Street, area, city, state" required aria-describedby="suAddressErr" maxlength="160"/></div>
            <p class="field-err" id="suAddressErr" hidden></p>
          </div>
          <div class="role-fields" data-for="company" hidden>
          <div class="field-grid">
          <div class="field">
            <label for="suCompany">Company name</label>
            <div class="input-wrap"><input id="suCompany" name="suCompany" type="text" autocomplete="organization" placeholder="Acme Realty Ltd" required aria-describedby="suCompanyErr" /></div>
            <p class="field-err" id="suCompanyErr" hidden></p>
          </div>
          <div class="field">
            <label for="suReg">CAC registration no.</label>
            <div class="input-wrap"><input id="suReg" name="suReg" type="text" autocomplete="off" placeholder="RC 1234567" required aria-describedby="suRegErr" autocapitalize="characters" spellcheck="false"/></div>
            <p class="field-err" id="suRegErr" hidden></p>
          </div>
          </div>
          </div>
          <div class="role-fields" data-for="agent" hidden>
          <div class="field-grid">
          <div class="field">
            <label for="suAgency">Agency (optional)</label>
            <div class="input-wrap"><input id="suAgency" name="suAgency" type="text" autocomplete="organization" placeholder="Your agency" aria-describedby="suAgencyErr" /></div>
            <p class="field-err" id="suAgencyErr" hidden></p>
          </div>
          <div class="field">
            <label for="suLicence">Licence / ID no. (optional)</label>
            <div class="input-wrap"><input id="suLicence" name="suLicence" type="text" autocomplete="off" placeholder="ESVARBON no." aria-describedby="suLicenceErr" spellcheck="false"/></div>
            <p class="field-err" id="suLicenceErr" hidden></p>
          </div>
          </div>
          </div>
          <div class="field">
            <label for="suPassword">Password</label>
            <div class="input-wrap">
              <input id="suPassword" name="suPassword" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required aria-describedby="suPasswordErr" minlength="8" maxlength="128"/>
              <button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false" data-toggle="suPassword"><svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <p class="field-err" id="suPasswordErr" hidden></p>
          </div>
          <div class="meter" id="suMeter" data-score="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <p class="meter-label" id="suMeterLabel" aria-live="polite">Use 8+ characters — a longer phrase is stronger.</p>
          <div class="field">
            <label for="suConfirm">Confirm password</label>
            <div class="input-wrap">
              <input id="suConfirm" name="suConfirm" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required aria-describedby="suConfirmErr" />
              <button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false" data-toggle="suConfirm"><svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <p class="field-err" id="suConfirmErr" hidden></p>
          </div>
          <button class="btn btn-gradient auth-submit" type="submit" id="suSubmit"><span class="btn-label" id="suLabel">Create customer account</span><span class="spinner" aria-hidden="true"></span></button>
        </form>

        <div class="divider"><span>or</span></div>
        <div class="google-slot" data-google="signup"></div>
        <p class="switch-note">Already have an account? <button class="link-btn" type="button" data-tab="signin">Sign in</button></p>
      </div>

      <noscript><p class="alert alert--static">JavaScript is required to sign in.</p></noscript>
    </section>
  </main>

  <template id="googleBtnTpl">
    <button class="btn-google" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.17a5.28 5.28 0 0 1-2.29 3.46v2.87h3.7C21.74 18.8 23 15.8 23 12.27z"/><path fill="#34A853" d="M12 23.5c3.1 0 5.7-1.03 7.58-2.78l-3.7-2.87c-1.03.69-2.34 1.1-3.88 1.1-2.98 0-5.5-2.01-6.4-4.72H1.78v2.96A11.5 11.5 0 0 0 12 23.5z"/><path fill="#FBBC05" d="M5.6 14.23a6.9 6.9 0 0 1 0-4.46V6.81H1.78a11.5 11.5 0 0 0 0 10.38l3.82-2.96z"/><path fill="#EA4335" d="M12 5.05c1.69 0 3.2.58 4.39 1.72l3.29-3.29C17.7 1.64 15.1.5 12 .5A11.5 11.5 0 0 0 1.78 6.81L5.6 9.77C6.5 7.06 9.02 5.05 12 5.05z"/></svg><span>Continue with Google</span></button>
  </template>

  <script src="auth.js?v=2" defer></script>
</body>
</html>
